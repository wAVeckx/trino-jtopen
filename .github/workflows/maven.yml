name: Java CI

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: maven

      # Compiles, runs the style, dependency and SPI checks and the unit tests, and builds the plugin archive.
      # The integration tests need an IBM i system and are skipped, see DEVELOPMENT.md.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Release
        uses: softprops/action-gh-release@v3
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          files: |
            target/trino-jtopen-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
